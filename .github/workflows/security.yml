# CodeQL, gitleaks, dependency review on pull requests, Semgrep and OpenSSF Scorecard. The jobs live in
# ChiefGyk3D/git-your-ship-together.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # weekly, so new advisories surface between commits
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@6f40107c2e05483f485452991e422f7f63886000 # v1.25.1
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      codeql-languages: actions   # no Python or other CodeQL-supported source here
      pip-audit-requirements: ""   # no Python dependencies in this repository
      scorecard: true
      egress-policy: block
