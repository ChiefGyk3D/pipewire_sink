# Native PipeWire combined sink (declarative, hotplug-safe)
# Install to: ~/.config/pipewire/pipewire.conf.d/60-combined-sink.conf
#
# This replaces the old `pactl load-module module-combine-sink` approach.
# Why this is better:
#   - The sink is created by the PipeWire core itself, at every start.
#     It can never be "lost" — no script has to recreate it.
#   - Slave sinks are matched by RULE, not by exact name. When a device
#     disappears (HDMI re-handshake, USB replug) its stream detaches; when
#     it comes back it reattaches automatically. No audio-stack restart.
#   - It does not live inside pipewire-pulse, so restarting any one service
#     no longer breaks it (the old module died with "Broken pipe" whenever
#     the core restarted underneath it).
#
# EDIT THE RULES BELOW to match your devices. Find your sink names with:
#   pactl list short sinks
# Use a regex ("~" prefix) that survives suffix changes across replugs
# (e.g. USB devices can change "-00" enumeration suffixes).
#
# The installer (install.sh) generates this file for you with detected devices.

context.modules = [
    { name = libpipewire-module-combine-stream
        args = {
            combine.mode = sink
            node.name = "combined_out"
            node.description = "Combined Audio Output"
            combine.latency-compensate = false
            combine.props = {
                audio.position = [ FL FR ]
            }
            stream.props = { }
            stream.rules = [
                {
                    # PRIMARY: main output (USB mixer / DAC / speakers)
                    matches = [
                        { media.class = "Audio/Sink"
                          node.name = "~alsa_output.usb-EXAMPLE_Device.*" }
                    ]
                    actions = { create-stream = { } }
                }
                {
                    # SECONDARY: HDMI / capture card output
                    matches = [
                        { media.class = "Audio/Sink"
                          node.name = "~alsa_output.pci-EXAMPLE.hdmi.*" }
                    ]
                    actions = { create-stream = { } }
                }
            ]
        }
    }
]
