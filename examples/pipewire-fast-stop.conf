# Drop-in for pipewire.service: install as
#   ~/.config/systemd/user/pipewire.service.d/fast-stop.conf
#
# PipeWire 1.0.3 can spin in its data loop (combine-stream "Broken pipe")
# and ignore SIGTERM. The default TimeoutStopSec of 90s then leaves audio
# dead for a minute and a half before systemd sends SIGKILL.
[Service]
TimeoutStopSec=5
